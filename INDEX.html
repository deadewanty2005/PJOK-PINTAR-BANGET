<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PJOK Pintar — Portal Pembelajaran</title>
<style>
:root{--navy:#14213d;--blue:#2563eb;--teal:#0f9d8a;--bg:#f3f6fb;--ink:#1f2937;--muted:#64748b;--card:#fff;--line:#e5eaf2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf1ff;color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}.muted{color:var(--muted)}
header{background:linear-gradient(120deg,#14213d,#1d4ed8);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:4;box-shadow:0 4px 18px #14213d22}
.brand{font-size:21px;font-weight:850;letter-spacing:.2px}.brand span{color:#7ee7d2}.userbar{display:flex;align-items:center;gap:10px;font-size:14px}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid var(--line);padding:20px 14px}.navbtn{display:block;width:100%;text-align:left;background:transparent;color:#475569;margin:4px 0;padding:12px}.navbtn.active,.navbtn:hover{background:#eaf1ff;color:#1d4ed8}
main{padding:26px;max-width:1400px;width:100%;margin:auto}.welcome{background:linear-gradient(115deg,#0f9d8a,#2563eb);color:white;border-radius:20px;padding:26px;margin-bottom:22px;display:flex;justify-content:space-between;gap:20px;align-items:center}.welcome h1{margin:0 0 8px;font-size:clamp(24px,4vw,34px)}.welcome p{margin:0;opacity:.9}.badge{background:#ffffff25;border:1px solid #ffffff55;padding:7px 11px;border-radius:999px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stats{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.stats strong{font-size:28px;display:block;color:#1d4ed8}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #0f172a06}.panel h2{margin:0 0 14px;font-size:20px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lesson{overflow:hidden;padding:0}.lesson img{width:100%;height:180px;object-fit:cover;display:block}.lesson .body{padding:17px}.tag{font-size:12px;color:#0f766e;background:#ccfbf1;padding:5px 9px;border-radius:99px;display:inline-block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{margin:10px 0}.field label{display:block;font-weight:650;font-size:14px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:14px}.table th{color:#64748b}.question{border:1px solid var(--line);padding:15px;border-radius:12px;margin:12px 0}.option{display:block;padding:8px 0}.option input{margin-right:8px}.hidden{display:none!important}.video{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;background:#0f172a}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#14213d,#2563eb)}.login{width:min(440px,100%);background:#fff;padding:30px;border-radius:20px;box-shadow:0 25px 70px #0003}.login h1{margin:0 0 5px}.login .brand{color:#14213d;margin-bottom:20px}.notice{background:#fff7ed;color:#9a3412;padding:12px;border-radius:10px;font-size:13px;margin:12px 0}.success{background:#dcfce7;color:#166534;padding:12px;border-radius:10px;margin:10px 0}.small{font-size:12px}.empty{text-align:center;padding:28px;color:#64748b}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:3}.navbtn{white-space:nowrap;width:auto;margin:0}.grid{grid-template-columns:repeat(2,1fr)}main{padding:16px}.cards{grid-template-columns:1fr}}
@media(max-width:520px){header{padding:14px}.brand{font-size:18px}.userbar span{display:none}.welcome{padding:20px}.grid,.two{grid-template-columns:1fr}.table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<div id="loginView" class="loginwrap">
 <div class="login">
  <div class="brand">🏅 PJOK <span style="color:#0f9d8a">PINTAR</span></div>
  <h1>Selamat datang!</h1><p class="muted">Portal pembelajaran Pendidikan Jasmani, Olahraga, dan Kesehatan.</p>
  <div class="field"><label>Nama pengguna</label><input id="username" placeholder="Contoh: guru atau siswa"></div>
  <div class="field"><label>Masuk sebagai</label><select id="role"><option value="siswa">Siswa</option><option value="guru">Guru</option></select></div>
  <div class="field"><label>Kata sandi demo</label><input id="password" type="password" placeholder="Masukkan kata sandi"></div>
  <button class="primary" style="width:100%;margin-top:8px" onclick="login()">Masuk ke PJOK Pintar</button>
  <p class="small muted">Mode demonstrasi: gunakan kata sandi <b>pjok123</b>. Data tersimpan di browser perangkat ini.</p>
 </div>
</div>
<div id="app" class="hidden">
<header><div class="brand">🏅 PJOK <span>PINTAR</span></div><div class="userbar"><span id="who"></span><button class="secondary" onclick="logout()">Keluar</button></div></header>
<div class="layout"><aside id="nav"></aside><main id="content"></main></div>
</div>
<script>
const defaultLessons=[
 {id:1,title:"Sepak Bola: Teknik Dasar",category:"Permainan Bola Besar",desc:"Pelajari passing, control, dribbling, shooting, serta aturan dasar permainan sepak bola.",img:"https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1000&q=80",video:"https://www.youtube.com/embed/6Hnכנ"},
 {id:2,title:"Bola Voli: Passing dan Servis",category:"Permainan Bola Besar",desc:"Mengenal passing bawah, passing atas, servis, rotasi, dan kerja sama tim.",img:"https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?auto=format&fit=crop&w=1000&q=80",video:"https://www.youtube.com/embed/9Nmew1"},
 {id:3,title:"Kebugaran Jasmani",category:"Kebugaran",desc:"Komponen kebugaran, pemanasan, latihan kekuatan, daya tahan, dan pendinginan.",img:"https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1000&q=80",video:"https://www.youtube.com/embed/ml6cT4AZdqI"},
 {id:4,title:"Renang: Keselamatan dan Gaya Bebas",category:"Aktivitas Air",desc:"Keselamatan di kolam, pernapasan, posisi tubuh, gerakan kaki dan lengan gaya bebas.",img:"https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=1000&q=80",video:"https://www.youtube.com/embed/7r6h2?rel=0"}
];
const defaultQuestions=[
 {id:1,q:"Teknik mengoper bola kepada teman dalam sepak bola disebut …",a:["Shooting","Passing","Heading","Dribbling"],correct:1,topic:"Sepak Bola"},
 {id:2,q:"Gerakan membawa bola dengan kaki sambil berlari disebut …",a:["Dribbling","Blocking","Servis","Smash"],correct:0,topic:"Sepak Bola"},
 {id:3,q:"Passing bawah dalam bola voli dilakukan menggunakan …",a:["Ujung jari","Kepala","Kedua lengan bawah","Satu kaki"],correct:2,topic:"Bola Voli"},
 {id:4,q:"Sebelum berolahraga sebaiknya melakukan …",a:["Pendinginan","Pemanasan","Tidur","Makan berat"],correct:1,topic:"Kebugaran"},
 {id:5,q:"Tujuan utama pemanasan adalah …",a:["Membuat cepat lelah","Mempersiapkan tubuh untuk aktivitas","Mengurangi konsentrasi","Menghentikan denyut jantung"],correct:1,topic:"Kebugaran"},
 {id:6,q:"Saat berenang, keselamatan yang benar adalah …",a:["Berenang sendirian","Berlari di tepi kolam","Mengikuti instruksi guru","Mendorong teman"],correct:2,topic:"Renang"}
];
let user=null,tab="dashboard";
let lessons=JSON.parse(localStorage.getItem("pjok_lessons")||"null")||defaultLessons;
let questions=JSON.parse(localStorage.getItem("pjok_questions")||"null")||defaultQuestions;
let results=JSON.parse(localStorage.getItem("pjok_results")||"[]");
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("pjok_lessons",JSON.stringify(lessons));localStorage.setItem("pjok_questions",JSON.stringify(questions));localStorage.setItem("pjok_results",JSON.stringify(results))}
function login(){let name=$("username").value.trim(),pass=$("password").value;if(!name)return alert("Masukkan nama pengguna.");if(pass!=="pjok123")return alert("Kata sandi demo salah. Gunakan pjok123.");user={name,role:$("role").value};$("loginView").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=name+" · "+(user.role==="guru"?"Guru":"Siswa");renderNav();show("dashboard")}
function logout(){user=null;$("app").classList.add("hidden");$("loginView").classList.remove("hidden");$("password").value}
function renderNav(){let items=[["dashboard","🏠 Dashboard"],["materi","📚 Materi PJOK"],["quiz","📝 Kuis & Ujian"],["hasil","📊 Hasil Penilaian"],["lokasi","📍 Lokasi Pengisian"]];if(user.role==="guru")items.splice(2,0,["kelola","🛠️ Kelola Soal"]);$("nav").innerHTML=items.map(([id,t])=>`<button class="navbtn ${tab===id?"active":""}" onclick="show('${id}')">${t}</button>`).join("")}
function show(t){tab=t;renderNav();let c=$("content");if(t==="dashboard")dashboard(c);if(t==="materi")materi(c);if(t==="kelola")kelola(c);if(t==="quiz")quiz(c);if(t==="hasil")hasil(c);if(t==="lokasi")lokasi(c)}
function dashboard(c){c.innerHTML=`<section class="welcome"><div><span class="badge">BELAJAR AKTIF • PJOK</span><h1>Halo, ${esc(user.name)}! 👋</h1><p>Sehat, bugar, sportif, dan berprestasi dimulai dari sini.</p></div><div style="font-size:58px">🏃‍♀️</div></section><div class="grid"><div class="stats"><span class="muted">Materi tersedia</span><strong>${lessons.length}</strong><small class="muted">Topik pembelajaran</small></div><div class="stats"><span class="muted">Bank soal</span><strong>${questions.length}</strong><small class="muted">Pertanyaan kuis</small></div><div class="stats"><span class="muted">Kuis dikerjakan</span><strong>${results.filter(x=>x.name===user.name).length}</strong><small class="muted">Riwayat akun ini</small></div></div><div class="panel" style="margin-top:18px"><h2>🚀 Mulai belajar</h2><p class="muted">Pilih materi untuk mempelajari teknik olahraga, tonton video pembelajaran, lalu uji pemahaman melalui kuis.</p><div class="row"><button class="primary" onclick="show('materi')">Jelajahi Materi</button><button class="secondary" onclick="show('quiz')">Kerjakan Kuis</button></div></div><div class="panel"><h2>✨ Tips PJOK</h2><p>Awali aktivitas dengan pemanasan, gunakan perlengkapan yang sesuai, minum air yang cukup, dan utamakan keselamatan serta sportivitas.</p></div>`}
function materi(c){c.innerHTML=`<div class="row" style="justify-content:space-between"><div><h1>Materi Pembelajaran</h1><p class="muted">Baca ringkasan dan tonton video pendukung.</p></div>${user.role==="guru"?'<button class="primary" onclick="lessonForm()">＋ Tambah Materi</button>':""}</div><div class="cards">${lessons.map(l=>`<article class="panel lesson"><img src="${esc(l.img)}" alt="Ilustrasi ${esc(l.title)}" onerror="this.src='https://placehold.co/800x400?text=Materi+PJOK'"><div class="body"><span class="tag">${esc(l.category)}</span><h2 style="margin:10px 0">${esc(l.title)}</h2><p class="muted">${esc(l.desc)}</p><button class="secondary" onclick="detail(${l.id})">Buka Materi →</button>${user.role==="guru"?` <button class="danger" onclick="delLesson(${l.id})">Hapus</button>`:""}</div></article>`).join("")}</div>`}
function detail(id){let l=lessons.find(x=>x.id===id);$("content").innerHTML=`<button class="secondary" onclick="show('materi')">← Kembali</button><div class="panel" style="margin-top:14px"><span class="tag">${esc(l.category)}</span><h1>${esc(l.title)}</h1><img src="${esc(l.img)}" style="width:100%;max-height:360px;object-fit:cover;border-radius:12px" onerror="this.style.display='none'"><p>${esc(l.desc)}</p><h2>Video pembelajaran</h2><div class="video"><iframe src="${esc(l.video)}" title="Video pembelajaran" allowfullscreen loading="lazy"></iframe></div><p class="small muted">Video ditampilkan dari sumber eksternal. Pastikan koneksi internet tersedia.</p></div>`}
function lessonForm(){let title=prompt("Judul materi:");if(!title)return;let category=prompt("Kategori:","PJOK");let desc=prompt("Deskripsi materi:","Materi pembelajaran PJOK.");let img=prompt("URL foto pembelajaran (https://...):","https://images.unsplash.com/photo-1517836357463-d25dfeac3438");let video=prompt("URL embed YouTube (contoh https://www.youtube.com/embed/VIDEO_ID):","https://www.youtube.com/embed/ml6cT4AZdqI");lessons.push({id:Date.now(),title,category:category||"PJOK",desc:desc||"",img:img||"",video:video||""});save();materi($("content"))}
function delLesson(id){if(confirm("Hapus materi ini?")){lessons=lessons.filter(x=>x.id!==id);save();materi($("content"))}}
function kelola(c){c.innerHTML=`<h1>Kelola Bank Soal</h1><p class="muted">Guru dapat menambah, mengedit, dan menghapus pertanyaan pilihan ganda.</p><div class="panel"><h2>Tambah soal</h2><div class="field"><label>Pertanyaan</label><textarea id="newq" placeholder="Tulis pertanyaan..."></textarea></div><div class="two">${[0,1,2,3].map(i=>`<div class="field"><label>Jawaban ${"ABCD"[i]}</label><input id="opt${i}" placeholder="Pilihan ${"ABCD"[i]}"></div>`).join("")}</div><div class="two"><div class="field"><label>Kunci jawaban</label><select id="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Topik</label><input id="topic" placeholder="Contoh: Atletik"></div></div><button class="primary" onclick="addQuestion()">Simpan soal</button></div><div class="panel"><h2>Daftar soal (${questions.length})</h2>${questions.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.q)}</b><p class="small muted">${esc(q.topic||"Umum")} · Kunci: ${"ABCD"[q.correct]}</p><div class="row"><button class="secondary" onclick="editQuestion(${q.id})">Edit</button><button class="danger" onclick="deleteQuestion(${q.id})">Hapus</button></div></div>`).join("")}</div>`}
function addQuestion(){let q=$("newq").value.trim(),a=[0,1,2,3].map(i=>$("opt"+i).value.trim());if(!q||a.some(x=>!x))return alert("Lengkapi pertanyaan dan empat pilihan.");questions.push({id:Date.now(),q,a,correct:+$("correct").value,topic:$("topic").value||"Umum"});save();kelola($("content"))}
function editQuestion(id){let q=questions.find(x=>x.id===id),v=prompt("Ubah pertanyaan:",q.q);if(v===null)return;let ans=prompt("Empat pilihan dipisahkan tanda |",q.a.join("|"));if(ans===null)return;let a=ans.split("|");if(a.length!==4)return alert("Harus tepat empat pilihan.");let key=prompt("Kunci jawaban A/B/C/D:", "ABCD"[q.correct]);if(!"ABCD".includes((key||"").toUpperCase()))return alert("Kunci tidak valid.");q.q=v;q.a=a;q.correct="ABCD".indexOf(key.toUpperCase());save();kelola($("content"))}
function deleteQuestion(id){if(confirm("Hapus soal?")){questions=questions.filter(q=>q.id!==id);save();kelola($("content"))}}
function quiz(c){if(!questions.length){c.innerHTML='<div class="panel empty">Belum ada soal.</div>';return}c.innerHTML=`<h1>Kuis PJOK</h1><p class="muted">Pilih satu jawaban untuk setiap pertanyaan. Nilai dihitung otomatis setelah dikirim.</p><div class="notice">Kerjakan dengan jujur. Pastikan semua jawaban sudah dipilih sebelum menekan tombol kirim.</div><form id="quizForm">${questions.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.q)}</b>${q.a.map((a,j)=>`<label class="option"><input type="radio" name="q${q.id}" value="${j}"> ${"ABCD"[j]}. ${esc(a)}</label>`).join("")}</div>`).join("")}<button type="button" class="primary" onclick="submitQuiz()">Kirim jawaban & lihat nilai</button></form><div id="quizResult"></div>`}
function submitQuiz(){let score=0,answered=0;questions.forEach(q=>{let a=document.querySelector(`input[name="q${q.id}"]:checked`);if(a){answered++;if(+a.value===q.correct)score++}});if(answered!==questions.length&&!confirm(`Baru ${answered} dari ${questions.length} soal terjawab. Tetap kirim?`))return;let pct=Math.round(score/questions.length*100);let record={id:Date.now(),name:user.name,score:pct,correct:score,total:questions.length,date:new Date().toLocaleString("id-ID")};results.unshift(record);save();$("quizResult").innerHTML=`<div class="success"><b>Kuis selesai!</b><br>Nilai: <strong>${pct}</strong> · Benar ${score} dari ${questions.length} soal.<br>${pct>=75?"Bagus! Pertahankan prestasimu.":"Tetap semangat, pelajari kembali materi dan coba lagi."}</div>`;document.querySelectorAll("#quizForm input").forEach(x=>x.disabled=true)}
function hasil(c){let data=user.role==="guru"?results:results.filter(r=>r.name===user.name);c.innerHTML=`<h1>Hasil Penilaian</h1><p class="muted">${user.role==="guru"?"Rekap nilai seluruh peserta yang menggunakan perangkat/data ini.":"Riwayat hasil kuis akun ini."}</p><div class="panel"><table class="table"><thead><tr><th>Nama</th><th>Nilai</th><th>Benar</th><th>Tanggal</th></tr></thead><tbody>${data.length?data.map(r=>`<tr><td>${esc(r.name)}</td><td><b>${r.score}</b></td><td>${r.correct}/${r.total}</td><td>${esc(r.date)}</td></tr>`).join(""):'<tr><td colspan="4">Belum ada hasil kuis.</td></tr>'}</tbody></table></div><button class="secondary" onclick="exportResults()">Unduh rekap CSV</button>`}
function exportResults(){let rows=[["Nama","Nilai","Benar","Total","Tanggal"],...results.map(r=>[r.name,r.score,r.correct,r.total,r.date])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="rekap-nilai-pjok.csv";a.click()}
function lokasi(c){c.innerHTML=`<h1>Lokasi Pengisian</h1><div class="panel"><p>Fitur ini meminta izin lokasi perangkat saat tombol ditekan. Lokasi hanya digunakan untuk mencatat posisi saat pengisian dan tidak diambil diam-diam.</p><div class="notice">Lokasi bersifat opsional. Browser biasanya meminta izin dan memerlukan HTTPS atau localhost. Koordinat hanya tampil di perangkat ini pada mode demo.</div><button class="primary" onclick="getLocation()">Izinkan & ambil lokasi saya</button><div id="locResult" style="margin-top:15px"></div></div>`}
function getLocation(){let el=$("locResult");if(!navigator.geolocation){el.textContent="Perangkat/browser tidak mendukung geolokasi.";return}el.textContent="Meminta izin lokasi…";navigator.geolocation.getCurrentPosition(p=>{let lat=p.coords.latitude,lon=p.coords.longitude;el.innerHTML=`<div class="success">Lokasi berhasil diperoleh setelah izin diberikan.<br>Latitude: ${lat.toFixed(6)}<br>Longitude: ${lon.toFixed(6)}<br>Akurasi: ±${Math.round(p.coords.accuracy)} meter<br><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${lat},${lon}">Lihat di peta</a></div>`},e=>{el.textContent=e.code===1?"Izin lokasi ditolak. Anda tetap dapat menggunakan aplikasi.":"Lokasi tidak tersedia. Periksa pengaturan perangkat dan koneksi.";},{enableHighAccuracy:true,timeout:12000})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
